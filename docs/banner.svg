<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="12"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" rx="12"/>

  <!-- AP Logo mark -->
  <rect x="80" y="60" width="56" height="56" rx="10" fill="#58a6ff"/>
  <text x="108" y="98" font-family="DM Mono, monospace" font-size="22" font-weight="700" fill="#0d1117" text-anchor="middle">AP</text>

  <!-- Title -->
  <text x="155" y="95" font-family="Inter, sans-serif" font-size="38" font-weight="800" fill="#e6edf3">ActionProof</text>
  <text x="155" y="130" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#8b949e">Runtime Security, Policy Enforcement &amp; Transaction Verification Gateway for AI Agents</text>

  <!-- Tag line -->
  <text x="80" y="180" font-family="DM Mono, monospace" font-size="15" font-weight="500" fill="#3fb950">✓ Tool Registry Pinning</text>
  <text x="350" y="180" font-family="DM Mono, monospace" font-size="15" font-weight="500" fill="#3fb950">✓ Policy Engine</text>
  <text x="560" y="180" font-family="DM Mono, monospace" font-size="15" font-weight="500" fill="#d29922">✓ Approval Tokens</text>
  <text x="790" y="180" font-family="DM Mono, monospace" font-size="15" font-weight="500" fill="#f85149">✓ Egress Protection</text>
  <text x="1030" y="180" font-family="DM Mono, monospace" font-size="15" font-weight="500" fill="#58a6ff">✓ Audit Chain</text>

  <!-- Core proposition -->
  <rect x="80" y="210" width="1040" height="70" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="255" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#e6edf3" text-anchor="middle">An AI agent may propose an action. ActionProof determines whether it executes.</text>

  <!-- Bottom stats -->
  <text x="80" y="300" font-family="DM Mono, monospace" font-size="11" fill="#8b949e">6 ATTACK SCENARIOS</text>
  <text x="280" y="300" font-family="DM Mono, monospace" font-size="11" fill="#8b949e">25 TESTS</text>
  <text x="400" y="300" font-family="DM Mono, monospace" font-size="11" fill="#8b949e">2 MCP SERVERS</text>
  <text x="560" y="300" font-family="DM Mono, monospace" font-size="11" fill="#8b949e">SHA-256 · HMAC-SHA256</text>
  <text x="800" y="300" font-family="DM Mono, monospace" font-size="11" fill="#8b949e">FASTAPI · SQLITE · THREE.JS · D3</text>
</svg>
